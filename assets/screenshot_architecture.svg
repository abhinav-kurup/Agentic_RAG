<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="880" viewBox="0 0 720 880">
  <style>
    .box { fill:none; stroke:#d1d5db; stroke-width:2; rx:6; ry:6 }
    .text { fill:#e5e7eb; font-family: Arial, Helvetica, sans-serif; font-size:14px }
    .title { fill:#fff; font-weight:700; font-size:16px }
    .arrow { stroke:#94a3b8; stroke-width:2; fill:none; marker-end: url(#arrowhead) }
    .bg { fill:#0b1220 }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="880" rx="0"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- START -->
  <rect class="box" x="300" y="20" width="120" height="36" />
  <text x="360" y="44" text-anchor="middle" class="title">START</text>

  <!-- Router -->
  <line class="arrow" x1="360" y1="56" x2="360" y2="96" />
  <rect class="box" x="240" y="96" width="240" height="40" />
  <text x="360" y="122" text-anchor="middle" class="text">Router</text>

  <!-- Branch arrows -->
  <line class="arrow" x1="300" y1="136" x2="240" y2="196" />
  <line class="arrow" x1="420" y1="136" x2="480" y2="196" />

  <!-- Reject -->
  <rect class="box" x="200" y="196" width="120" height="36" />
  <text x="260" y="220" text-anchor="middle" class="text">Reject</text>

  <!-- Retrieval -->
  <rect class="box" x="440" y="196" width="160" height="36" />
  <text x="520" y="220" text-anchor="middle" class="text">Retrieval</text>

  <!-- No docs and docs found branching -->
  <line class="arrow" x1="260" y1="232" x2="260" y2="280" />
  <line class="arrow" x1="520" y1="232" x2="520" y2="272" />

  <rect class="box" x="200" y="280" width="120" height="36" />
  <text x="260" y="304" text-anchor="middle" class="text">END</text>

  <rect class="box" x="440" y="280" width="160" height="36" />
  <text x="520" y="304" text-anchor="middle" class="text">Extraction</text>

  <!-- Extraction to Analysis -->
  <line class="arrow" x1="520" y1="316" x2="520" y2="372" />
  <rect class="box" x="440" y="372" width="160" height="36" />
  <text x="520" y="396" text-anchor="middle" class="text">Analysis</text>

  <!-- Analysis to Tools branching -->
  <line class="arrow" x1="520" y1="408" x2="520" y2="456" />
  <line class="arrow" x1="520" y1="408" x2="400" y2="456" />

  <rect class="box" x="360" y="456" width="120" height="36" />
  <text x="420" y="480" text-anchor="middle" class="text">Tools</text>

  <rect class="box" x="520" y="456" width="120" height="36" />
  <text x="580" y="480" text-anchor="middle" class="text">END</text>

  <!-- Tools back to Analysis -->
  <line class="arrow" x1="420" y1="492" x2="520" y2="540" />
  <rect class="box" x="440" y="540" width="160" height="36" />
  <text x="520" y="564" text-anchor="middle" class="text">Analysis</text>

  <text x="360" y="620" text-anchor="middle" class="text">(loop until END)</text>
</svg>